<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボール候補の確認・9件</title><style>
body{font-family:system-ui,sans-serif;background:#101820;color:#eff5fa;margin:0 auto;padding:20px;max-width:1320px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7}button,select,textarea{font:inherit}button{background:#24445c;color:white;border:1px solid #68879c;border-radius:8px;padding:11px 16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{color:#a9dfec}#message{min-height:24px;color:#ffe295}.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;margin:15px 0}video{width:100%;background:#000;max-height:480px}canvas{width:100%;height:auto;display:block}#patch{width:240px;max-width:100%;border:1px solid #69859b}#imagebox{overflow:auto;max-height:720px;background:black;border:1px solid #536979}#still{min-width:100%}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.choice{display:flex;align-items:center;gap:8px;padding:14px 20px;border:1px solid #71869b;border-radius:9px;cursor:pointer}.choice:has(input:checked){background:#245b79;border-color:#68ccff}input{width:20px;height:20px}textarea{width:100%;box-sizing:border-box;background:#192d3d;color:white;border:1px solid #68879c;padding:8px}small{color:#b5c8d5}#save{background:#16674f}#done{padding:25px;background:#173d30;font-size:20px}@media(max-width:750px){.grid{grid-template-columns:1fr}#patch{width:192px}}
</style><h1>青丸の中のものは、ボールですか？</h1>
<p>9件を1つずつ確認します。前後の動画と、下の静止画・拡大画像を参考にしてください。<br><b>別の本物のボールでも「ボール」</b>を選んでください。見分けにくければ「判断できない」で大丈夫です。中心のクリックは不要です。</p>
<div class="bar"><b id="progress"></b><label>対象 <select id="jump"></select></label><span id="status" class="status"></span></div>
<div id="review"><div class="grid"><div><video id="video" controls playsinline preload="auto"></video><small>0.5倍速。対象フレームでは一時停止表示し、青丸を出します。</small></div><aside><b>対象の拡大（同じ瞬間）</b><canvas id="patch" width="384" height="384"></canvas><small>青丸の中心付近の物体を判定してください。</small></aside></div>
<div class="choices"><label class="choice"><input type="radio" name="label" value="ball">ボール</label><label class="choice"><input type="radio" name="label" value="not_ball">別の物体</label><label class="choice"><input type="radio" name="label" value="uncertain">判断できない</label></div>
<textarea id="notes" rows="2" maxlength="1000" placeholder="メモ（任意）"></textarea><div class="bar" style="margin-top:12px"><button id="prev">前へ</button><button id="save">保存して次へ</button><span id="message" role="status"></span></div>
<p><b id="frame"></b>　<button id="zoom">静止画を2倍にする</button></p><div id="imagebox"><canvas id="still" width="1920" height="1080"></canvas></div></div>
<div id="done" hidden>9件すべて保存できました。チャットで「終わった」と伝えてください。<p><button id="back">確認画面に戻る</button></p></div>
<script>
'use strict';let cases=[],index=0,dirty=false,zoomed=false,renderId=0;const $=id=>document.getElementById(id),base=new URL('.',location.href);const url=p=>new URL(p,base).href;
function message(x){$('message').textContent=x}function count(){return cases.filter(c=>c.object_label!=='unreviewed').length}
function image(src){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('画像を読み込めませんでした。'));im.src=src})}
function circle(ctx,x,y,r){ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#43b8ff';ctx.lineWidth=3;ctx.stroke()}
async function render(){let seq=++renderId,c=cases[index];dirty=false;zoomed=false;$('still').style.width='100%';$('zoom').textContent='静止画を2倍にする';$('review').hidden=false;$('done').hidden=true;
 $('progress').textContent=`${index+1} / ${cases.length}（${c.case_id}）`;$('status').textContent=`保存済み ${count()} / ${cases.length}`;$('jump').value=String(index);$('frame').textContent=`${c.candidate_id.slice(-3)} ／ frame ${c.local_frame}`;
 for(let r of document.querySelectorAll('[name=label]'))r.checked=r.value===c.object_label;$('notes').value=c.notes;$('prev').disabled=index===0;message(c.object_label==='unreviewed'?'判定を選び、「保存して次へ」を押してください。':'保存済みです。変更して再保存できます。');
 $('video').src=url(`video/${c.case_id}.mp4`);$('video').load();
 try{let [im,p]=await Promise.all([image(url(`image/${c.case_id}.jpg`)),image(url(`patch/${c.case_id}.png`))]);if(seq!==renderId)return;let ctx=$('still').getContext('2d');ctx.clearRect(0,0,1920,1080);ctx.drawImage(im,0,0,1920,1080);circle(ctx,c.candidate_x_px,c.candidate_y_px,16);let pc=$('patch').getContext('2d');pc.imageSmoothingEnabled=false;pc.drawImage(p,0,0,384,384);circle(pc,192,192,32)}catch(e){message(e.message)}
}
function canLeave(){return !dirty||confirm('まだ保存していません。変更を破棄して移動しますか？')}
$('jump').onchange=()=>{if(canLeave()){index=Number($('jump').value);render()}else $('jump').value=String(index)};$('prev').onclick=()=>{if(canLeave()){index--;render()}};
document.querySelectorAll('[name=label]').forEach(r=>r.onchange=()=>dirty=true);$('notes').oninput=()=>dirty=true;
$('zoom').onclick=()=>{zoomed=!zoomed;$('still').style.width=zoomed?'200%':'100%';$('zoom').textContent=zoomed?'静止画を元の大きさに戻す':'静止画を2倍にする'};
$('save').onclick=async()=>{let selected=document.querySelector('[name=label]:checked');if(!selected){message('3つの判定から1つ選んでください。');return}$('save').disabled=true;try{let r=await fetch(url('api/save'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:cases[index].case_id,object_label:selected.value,notes:$('notes').value})});let data=await r.json();if(!r.ok)throw Error(data.error||'保存できませんでした。');cases=data.cases;dirty=false;updateOptions();if(index<cases.length-1){index++;await render()}else if(count()===cases.length){$('video').pause();$('review').hidden=true;$('done').hidden=false;$('status').textContent='保存済み 9 / 9'}else{index=cases.findIndex(c=>c.object_label==='unreviewed');await render()}}catch(e){message(e.message)}finally{$('save').disabled=false}};
function updateOptions(){$('jump').replaceChildren(...cases.map((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=c.case_id+(c.object_label==='unreviewed'?'':' ✓');return o}))}
$('back').onclick=()=>render();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
fetch(url('api/cases')).then(r=>{if(!r.ok)throw Error('データを読み込めませんでした。');return r.json()}).then(d=>{cases=d.cases;updateOptions();let pending=cases.findIndex(c=>c.object_label==='unreviewed');index=pending<0?0:pending;return render()}).catch(e=>message(e.message));
</script></html>
